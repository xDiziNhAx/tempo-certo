<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Certo</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    
    <header class="hero">
        <div class="icone-clima">☀️</div>
        <h1>Tempo Certo</h1>
        <p>Consulte a previsão do tempo da sua cidade de forma rápida, prática e gratuita.</p>
        <button id="btnClima">🌤 Consultar Clima</button>
    </header>

  
    <main>
         
        <section class="busca" id="busca">
            <h2>Descubra o clima</h2>
            <input type="text" id="cidadeInput" placeholder="Digite o nome da cidade">
            <button id="btnBuscar">Buscar clima</button>
        </section>

        <section class="resultado" id="resultado">
            <h3>🌦 Resultado aparecerá aqui</h3>
        </section>

       
        <section class="contato" id="contato">
            <h2>Entre em contato</h2>
            <form id="formContato">
                <input type="text" name="nome" placeholder="Seu nome" required>
                <input type="email" name="email" placeholder="Seu email" required>
                <textarea name="mensagem" placeholder="Sua mensagem" required></textarea>
                <button type="submit">Enviar</button>
            </form>
        </section>

      
        <section class="cadastro" id="cadastro">
            <h2>Cadastre-se</h2>
            <form id="formCadastro">
                <input type="email" name="email" placeholder="Digite seu email" required>
                <input type="password" name="senha" placeholder="Digite sua senha" required>
                <button type="submit">Cadastrar</button>
            </form>
            <div id="mensagemCadastro"></div>
        </section>
    </main>

  
    <footer>
        <p>© 2026 - Tempo Certo | Desenvolvido por Ingrid Rodrigues</p>
    </footer>

   
    <script src="js/script.js"></script>
</body>
</html>
